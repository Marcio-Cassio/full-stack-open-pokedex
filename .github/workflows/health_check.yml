name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed app is alive
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://this-host-does-not-exist-9x8y7z.onrender.com/health
          max-attempts: 3
          retry-delay: 10s

      - name: Health check failure notification
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Failure
          title: "Pokedex health check failed"
          description: "The deployed app is not responding: https://full-stack-open-pokedex-allm.onrender.com/"
          color: 0xff0000